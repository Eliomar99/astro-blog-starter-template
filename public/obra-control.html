<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1310;--surface:#121c17;--surface2:#17241d;--text:#e6efe9;--muted:#8fa89a;--border:#22342a;--primary:#1f7a4a;--primary-soft:#10281b;--ok:#4ade80;--ok-soft:#0f2a1c;--warn:#fbbf24;--warn-soft:#2e2410;--danger:#f87171;--danger-soft:#2d1717;--info:#93c5fd;--info-soft:#14233a;--side:#070d14;--side-text:#8fa0b5;--shadow:none}}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-text);padding:22px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{color:#fff;font-weight:700;letter-spacing:.4px;padding:4px 10px 22px;font-size:15px}
.brand small{display:block;color:var(--side-text);font-weight:400;font-size:11px;margin-top:2px;letter-spacing:0}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;width:100%;box-sizing:border-box;color:var(--side-text);font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.active{background:rgba(255,93,14,.18);color:#fff;box-shadow:inset 3px 0 0 #ff5d0e}
.hdr{background:#ff5d0e;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-radius:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.hdr img{height:44px;display:block}
.hdr img:not(.ok){display:none}
.brand img{display:none}
.hdr #hdrSlogan{font-weight:600;font-size:14px}
@media (max-width:600px){.hdr{flex-direction:column;align-items:flex-start}.hdr div{text-align:left!important}}
.badge{background:#b91c1c;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:11px;padding:10px}
.side-foot button{all:unset;cursor:pointer;color:var(--side-text);border:1px solid #23364d;border-radius:8px;padding:6px 10px;margin-top:8px;display:inline-block}
main{padding:26px 30px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.4px}
.sub{color:var(--muted);margin-top:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 15px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500;box-shadow:var(--shadow);white-space:nowrap;transition:border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:var(--primary)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn:focus-visible,nav button .ico{width:18px;height:18px;flex:none;opacity:.9}
nav button{justify-content:flex-start;gap:10px}
nav button .badge{margin-left:auto}
.ico{width:16px;height:16px;flex:none;vertical-align:-3px}
.btn .ico{margin-right:2px}
nav button:focus-visible{outline:2px solid var(--primary-2,var(--primary));outline-offset:2px}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;box-shadow:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 8px 22px rgba(16,24,40,.08)}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.kpi .label{color:var(--muted);font-size:12px;font-weight:500}
.kpi .value{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .hint{color:var(--muted);font-size:12px;margin-top:2px}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:980px){.grid-2,.grid-2b{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.brand{display:none}nav{display:flex;gap:4px}nav button{white-space:nowrap;width:auto}.side-foot{display:none}main{padding:16px}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:var(--surface2);border-bottom:1px solid var(--border)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--primary-soft);color:var(--primary)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;background:var(--surface2)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert b{font-weight:600}
.banner{background:var(--primary-soft);color:var(--primary);padding:11px 14px;border-radius:11px;margin-bottom:14px;font-size:13px}
.field{display:block}
input,select,textarea{font:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.section{margin:20px 0 8px;font-weight:600;font-size:13px}
.row{display:grid;gap:8px;grid-template-columns:2fr 1fr 1.3fr 1fr 1fr auto;align-items:end;margin-bottom:8px}
.row.ef{grid-template-columns:2fr 1fr auto}
@media (max-width:820px){.row,.row.ef{grid-template-columns:1fr 1fr}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:34px}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kv div{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px}
.kv span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kv b{font-size:16px;font-weight:600}
.rdo-prev{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface2)}
.rdo-prev header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rdo-prev ul{margin:8px 0 0;padding-left:18px}
.status-box{padding:11px 14px;border-radius:11px;margin:12px 0;font-size:13px}
.status-box.wait{background:var(--primary-soft);color:var(--primary)}
.status-box.err{background:var(--danger-soft);color:var(--danger)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--side);color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:360px;z-index:50}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--danger)}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:16px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:min(380px,100%);box-shadow:var(--shadow)}
body.logado .login{display:none}
body:not(.logado) .app{display:none}
body[data-papel="seguranca"] [data-act="dds-del"],body[data-papel="seguranca"] [data-act="foto-del"],body[data-papel="seguranca"] [data-act="pasta-del"],body[data-papel="encarregado"] [data-act="del"]{display:none!important}
main{max-width:1400px;margin:0 auto}
@media (min-width:1600px){.app{grid-template-columns:248px 1fr}main{padding:32px 40px}}
@media (max-width:760px){
  main{padding:14px 12px 28px}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .value{font-size:20px}
  .kpi .hint{font-size:11px}
  .topbar{flex-direction:column;align-items:stretch;gap:10px}
  .filters{width:100%}
  .filters>*{flex:1 1 140px;min-width:0;max-width:100%}
  .filters input,.filters select{width:100%}
  .btn{min-height:40px;padding:9px 12px;font-size:13.5px}
  .hdr{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px}
  .form-grid{grid-template-columns:1fr}
  .row,.row.ef{grid-template-columns:1fr}
  .actions{flex-direction:column-reverse}
  .actions .btn{width:100%}
  .kv{grid-template-columns:1fr 1fr}
  .grid-2,.grid-2b{grid-template-columns:1fr}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  canvas{max-height:240px}
  .toast{left:12px;right:12px;bottom:12px;max-width:none}
  .login-card{padding:22px 18px}
  .alert{padding:10px 12px}
  nav button{padding:9px 12px;font-size:13px}
}
@media (max-width:420px){
  .kpis{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
@media (hover:none){
  .card:hover{box-shadow:var(--shadow)}
  .btn,nav button{min-height:40px}
}
.print-only{display:none}
@media print{aside,.filters,.no-print,.topbar .btn{display:none!important}.app{display:block}main{padding:0}.card{box-shadow:none;break-inside:avoid}.print-only{display:block}body{background:#fff}}

/* ---------- animação do menu lateral ---------- */
@keyframes navIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@keyframes barGlow { 0%, 100% { box-shadow: inset 3px 0 0 #ff5d0e; } 50% { box-shadow: inset 3px 0 0 #ff5d0e, 0 0 14px rgba(255,93,14,.35); } }
aside nav button { animation: navIn .5s cubic-bezier(.2,.7,.2,1) both; }
aside nav button:nth-child(1) { animation-delay: .05s; }
aside nav button:nth-child(2) { animation-delay: .10s; }
aside nav button:nth-child(3) { animation-delay: .15s; }
aside nav button:nth-child(4) { animation-delay: .20s; }
aside nav button:nth-child(5) { animation-delay: .25s; }
aside nav button:nth-child(6) { animation-delay: .30s; }
aside nav button:nth-child(7) { animation-delay: .35s; }
aside nav button:nth-child(8) { animation-delay: .40s; }
aside nav button:nth-child(9) { animation-delay: .45s; }
aside nav button .ico { transition: transform .25s ease, color .25s ease; }
aside nav button:hover .ico { transform: translateX(2px) scale(1.12); color: #ff8a4c; }
aside nav button.active { animation: barGlow 2.4s ease-in-out infinite; }
aside nav button:active { transform: scale(.98); transition: transform .1s; }
.side-foot button { transition: background .2s, transform .15s; }
.side-foot button:hover { transform: translateY(-1px); }
@media (prefers-reduced-motion: reduce) {
  aside nav button, aside nav button.active, aside nav button .ico { animation: none !important; transition: none !important; }
}

/* ---------- botão de recarregar (canto) ---------- */
.reload { position: fixed; bottom: 20px; right: 20px; z-index: 40; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface); color: var(--primary); display: flex; align-items: center;
  justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(16,24,40,.18); transition: transform .4s ease, background .2s; }
.reload:hover { transform: rotate(180deg); background: var(--primary-soft); }
.reload:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.reload svg { width: 20px; height: 20px; }
@media print { .reload { display: none !important; } }

/* ---------- ajustes por resolução ---------- */
@media (min-width: 1024px) and (max-width: 1599px) { main { max-width: 1200px; } }
@media (min-width: 1920px) { main { max-width: 1600px; } body { font-size: 15px; } }
@media (max-width: 480px) {
  main { padding: 12px 10px 90px; }
  h1 { font-size: 19px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi .value { font-size: 18px; }
  .card { padding: 12px; }
  .btn, nav button { min-height: 44px; }
  input, select, textarea { font-size: 16px; }
  .hdr img { height: 36px; }
  .reload { width: 48px; height: 48px; bottom: 16px; right: 14px; }
}
@media (hover: none) { .reload:hover { transform: none; } .reload:active { transform: rotate(180deg); } }

/* ================= DESIGN PROFISSIONAL OBRA CONTROL ================= */
:root {
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15,31,22,.06);
  --shadow-md: 0 4px 14px rgba(15,31,22,.08);
  --brand-orange: #ff5d0e;
  --brand-orange-dark: #e04a00;
  --brand-green: #00331c;
  --focus: #ff5d0e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --shadow-sm: none; --shadow-md: 0 4px 18px rgba(0,0,0,.35); }
}
:root[data-theme="dark"] { --shadow-sm: none; --shadow-md: 0 4px 18px rgba(0,0,0,.35); }

body {
  font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
  text-rendering: optimizeLegibility;
}
h1 { font-weight: 700; letter-spacing: -.02em; }
h2, h3 { letter-spacing: -.01em; }
.sub { font-size: 13px; }

/* Menu lateral */
aside {
  background: linear-gradient(180deg, var(--brand-green) 0%, #00261a 100%);
  border-right: 1px solid rgba(255,255,255,.04);
}
.brand { padding: 6px 10px 22px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
.brand span { font-weight: 700; font-size: 14px; letter-spacing: .14em; }
.brand small { font-size: 11px; opacity: .75; }
nav button { border-radius: var(--radius-sm); font-size: 13.5px; }
nav button:hover { background: rgba(255,255,255,.07); }
nav button.active { background: rgba(255,93,14,.16); }
.side-foot { border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; }
.side-foot button { border-radius: var(--radius-sm); border-color: rgba(255,255,255,.14); }
.side-foot button:hover { background: rgba(255,255,255,.06); }

/* Cabeçalho */
.hdr {
  background: linear-gradient(120deg, var(--brand-orange) 0%, var(--brand-orange-dark) 100%);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 14px 20px;
}
.hdr #hdrSlogan { font-weight: 600; letter-spacing: .01em; }

/* Cartões e indicadores */
.card {
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border-color: color-mix(in srgb, var(--border) 85%, transparent);
}
.card:hover { box-shadow: var(--shadow-md); }
.card h3 { font-size: 14px; font-weight: 600; color: var(--text); }
.kpi::before { width: 4px; background: linear-gradient(180deg, var(--brand-orange), var(--brand-green)); }
.kpi .value { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .label { text-transform: none; font-size: 12.5px; }

/* Botões */
.btn { border-radius: var(--radius-sm); font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow-sm); transition: background .18s, border-color .18s, transform .12s, filter .18s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand-orange); border-color: var(--brand-orange); color: #fff; }
.btn.primary:hover { background: var(--brand-orange-dark); border-color: var(--brand-orange-dark); filter: none; }
.btn.ghost:hover { background: var(--surface2); }
.btn:focus-visible, nav button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

/* Campos */
input, select, textarea { border-radius: var(--radius-sm); transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(255,93,14,.18); }
label { font-size: 12px; font-weight: 600; letter-spacing: .01em; }

/* Tabelas */
th { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
td { font-variant-numeric: tabular-nums; }
tr.click:hover td { background: color-mix(in srgb, var(--brand-orange) 5%, var(--surface2)); }

/* Selos e alertas */
.pill { border-radius: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; }
.alert { border-radius: var(--radius); }
.banner { border-radius: var(--radius); }

/* Tela de login */
.login { background: radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--brand-orange) 14%, transparent), transparent), var(--bg); }
.login-card { border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
#loginForm .btn.primary { border-radius: var(--radius-sm); font-size: 14px; }

/* Rodapé fixo do canto */
.reload { box-shadow: var(--shadow-md); }
.reload:hover { color: var(--brand-orange); }

/* Acessibilidade e movimento */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
/* ---------- correções do celular ---------- */
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  aside{position:sticky;top:0;z-index:30;width:100%;min-width:0;max-width:100vw;align-self:start;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;padding:max(10px,env(safe-area-inset-top)) 10px 10px}
  aside::-webkit-scrollbar{display:none}
  nav,nav button{flex:none}
  main{min-width:0;width:100%;overflow-x:hidden}
  .hdr{overflow:hidden;min-width:0}
  .hdr img.ok{max-width:100%;height:auto;max-height:40px}
  .filters .btn{white-space:normal;line-height:1.25}
  .filters>*{max-width:100%}
}
</style>

/* ---------- checagens automáticas ---------- */
function checar(r){
  const out = [], tot = efTotal(r);
  if (r.totalInf != null && +r.totalInf !== tot) out.push({sev:"warn", tipo:"Efetivo", msg:`Soma dos nomes/funções (${tot}) diferente do total informado (${r.totalInf}).`});
  if (r.dataCabecalho && r.dataCabecalho !== r.data) out.push({sev:"warn", tipo:"Data", msg:`Cabeçalho diz ${fmtData(r.dataCabecalho)}, campo DATA diz ${fmtData(r.data)}.`});
  if (r.conflito) out.push({sev:"info", tipo:"Versões", msg:r.conflito});
  (r.atividades||[]).forEach(a => {
    if (a.estaca && a.un==="m" && a.qtd!=null) {
      const exp = estacaDist(a.estaca);
      if (exp!=null && exp !== +a.qtd) out.push({sev:"warn", tipo:"Quantidade", msg:`${a.desc} (estaca ${a.estaca}): as estacas dão ${exp} m, informado ${a.qtd} m.`});
    }
    if (a.qtd==null && r.status==="produtivo") out.push({sev:"info", tipo:"Quantidade", msg:`${a.desc}: sem quantidade.`});
  });
  return out;
}
function diasSemRdo(list){
  if (!list.length) return [];
  const datas = new Set(list.map(r=>r.data)), out = [];
  let d = new Date(list[0].data+"T12:00:00"); const fim = new Date(list[list.length-1].data+"T12:00:00");
  while (d <= fim) { const iso = d.toISOString().slice(0,10); if (!datas.has(iso)) out.push(iso); d.setDate(d.getDate()+1); }
  return out;
}
function todosAlertas(list){
  const rows = [];
  list.forEach(r => checar(r).forEach(x => rows.push({...x, rdo:r})));
  const cont = {}; list.forEach(r => { const k = r.obra+"|"+r.data; cont[k]=(cont[k]||0)+1; });
  Object.keys(cont).filter(k=>cont[k]>1).forEach(k => { const [o,d]=k.split("|"); rows.push({sev:"warn", tipo:"Duplicidade", msg:`${cont[k]} RDOs para ${fmtData(d)} em ${o}.`}); });
  diasSemRdo(list).forEach(d => rows.push({sev:"info", tipo:"Sem RDO", msg:`Nenhum RDO em ${fmtData(d)}.`}));
  return rows;
}
function filtrados(){
  const f = state.f;

}

  const r = ALMOX.reqs.find(x=>x.id===rid); if (!r || !r.itens[ix]) return;

function drawDashboard(list){
  const cP = document.getElementById("cProd"); if (!cP) return;

  const labels = list.map(r=>fmtData(r.data).slice(0,5));

function redimensionar(file){
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 640/Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); resolve({nome: file.name, src: c.toDataURL("image/jpeg", 0.72)}); }; img.onerror = () => resolve(null); img.src = r.result; };
    r.onerror = () => resolve(null); r.readAsDataURL(file);
  });
}

function parseDdsWhats(texto){
  const re = /LOCAL (?:DA|DE) ATIVIDADE:\s*([^\n]+)|DDS(?: GERAL)?:\s*(\d{2}\/\d{2}\/\d{4})/gi;
  const ev = []; let m;
  while ((m = re.exec(texto))) ev.push({tipo: m[1] ? "local" : "dds", valor: (m[1] || m[2]).trim(), inicio: m.index, fim: re.lastIndex});
  const out = []; let local = null;
  ev.forEach((e, i) => {
    if (e.tipo === "local") { local = e.valor.replace(/[*_]/g, "").trim(); return; }
    const prox = ev[i+1] ? ev[i+1].inicio : texto.length;
    const corpo = texto.slice(e.fim, prox);
    const [d, mo, y] = e.valor.split("/");
    const tema = ((corpo.match(/Tema:\s*(.+)/i)||[])[1] || "").replace(/[*"“”]/g, "").replace(/\.$/, "").trim();
    const interl = ((corpo.match(/(?:Interlocutor(?:es)?|Palestrante):\s*(.+)/i)||[])[1] || "").replace(/\*/g, "").trim();
    const min = +((corpo.match(/Tempo:\s*(\d+)/i)||[])[1] || 20);
    const total = +((corpo.match(/Total de colaboradores:\s*(\d+)/i)||[])[1] || 0);
    const veic = +((corpo.match(/Total de Ve[ií]culos:\s*(\d+)/i)||[])[1] || 0);
    const efetivo = [];
    corpo.split(/Total de colaboradores/i)[0].split(/\r?\n/).forEach(l => { const mm = l.match(/^\s*[-*•]?\s*(\d+)\s*-\s*(.+?)\s*$/); if (mm) efetivo.push({funcao: mm[2], qtd: +mm[1]}); });
    out.push({id: uid(), data: `${y}-${mo}-${d}`, tema: tema || "Sem tema informado", local: local || "Não informado", interl, min, total, veic, assuntos: [], efetivo, presentes: []});
    local = null;
  });
  return out;
}

const SHA_K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  }

const PROMPT = `Você interpreta mensagens de RDO (Relatório Diário de Obra) copiadas de um grupo de WhatsApp de encarregados. Obras possíveis: "Túnel 201 – Rodoanel Norte", "Túnel 101 – Lado interno e externo – Rodoanel Norte", ou a informada em "OBRA:"/"LOCAL DA ATIVIDADE:".
Regras:
- Ignore DDS, avisos de programação e mensagens de mídia. Mensagens de segurança não são RDO.
- Agrupe por data e responsável. Cada grupo vira um RDO.
- Data no formato YYYY-MM-DD, usando o campo DATA (se houver conflito com o cabeçalho, prefira DATA e registre aviso). Ano 2026 se faltar.
- obra: nome como escrito na mensagem, ou null.
- efetivo: funções com quantidade. Se houver nomes listados, a quantidade é o número informado.
- atividades: desc, estaca (texto, ex.: "2018 a 2010"), qtd (número com ponto decimal, ou null se não houver), un (m, m², m³, un, t, h, kg, vb ou %).
- totalInf: total de colaboradores informado na mensagem, ou null.
- Não invente valores.
Responda SOMENTE com JSON válido, sem texto antes ou depois, sem crases, no formato:
{"rdos":[{"data":"YYYY-MM-DD","obra":null,"responsavel":"","turno":"Diurno","clima":"Não informado","pluviometro":null,"totalInf":null,"efetivo":[{"funcao":"","qtd":0}],"atividades":[{"desc":"","lado":"","estaca":"","qtd":null,"un":""}],"ocorrencias":""}],"avisos":[""]}`;
async function interpretar(texto){
  const claude = window.claude; const sample = claude && await claude.use("sample");
  if (!sample) throw new Error("sem-ia");
  const r = await sample(PROMPT + "\n\nMENSAGENS:\n" + texto, {modelTier:"default"});
  const raw = String(r.text || "").replace(/```json|```/g, "").trim();
  return JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}")+1));
}
function estatusInferido(x){
  if ((x.atividades||[]).some(a=>a.qtd!=null && a.qtd!=="")) return "produtivo";
  const t = (x.ocorrencias||"").toLowerCase();
  if (/paraliz/.test(t)) return "paralisado";
  if (/aguard/.test(t)) return "aguardando";
  return "produtivo";
}
function normalizar(json){
  const avisos = [...(json.avisos||[])];
  const rdos = (json.rdos||[]).map(x => {
    const atividades = (x.atividades||[]).filter(a=>a.desc).map(a=>({desc:String(a.desc), lado:a.lado||"", estaca:String(a.estaca||""), qtd: (a.qtd===null||a.qtd===undefined||a.qtd==="") ? null : +a.qtd, un: UN.includes(a.un) ? a.un : (a.un||"un")}));
    const ef = (x.efetivo||[]).map(e=>({funcao:String(e.funcao||"Total"), qtd:+e.qtd||0}));
    return {data: /^\d{4}-\d{2}-\d{2}$/.test(x.data) ? x.data : new Date().toISOString().slice(0,10),
      obra: x.obra || OBRA, responsavel: x.responsavel || "", status: estatusInferido({...x, atividades}), turno: ["Diurno","Noturno","Integral"].includes(x.turno) ? x.turno : "Diurno",
      clima: CLIMAS.includes(x.clima) ? x.clima : "Não informado", pluviometro: x.pluviometro==null ? null : +x.pluviometro,
      totalInf: x.totalInf==null ? null : +x.totalInf, ef, atividades, ocorrencias: x.ocorrencias || "", fonte: "WhatsApp (colado)"};
  });
  return {rdos, avisos};
}
/* leitor de modelo fixo para o formato de RDO, usado quando a IA não estiver disponível */
function parseTemplate(texto){
  const partes = texto.split(/DATA:\s*(\d{2}\/\d{2}\/\d{4})/i);
  const rdos = [], avisos = [];
  for (let i = 1; i < partes.length; i += 2) {
    const [d, m, y] = partes[i].split("/");
    const body = partes[i+1] || "";
    const obra = ((body.match(/OBRA:\s*(.+)/i)||[])[1] || "").trim() || null;
    const enc = ((body.match(/Encarregado[^\n–-]*[–-]\s*([^;\n]+)/i)||[])[1] || "").replace(/[;.:]+$/,"").trim();
    const prod = (body.split(/EFETIVO MOBILIZADO/i)[0].split(/PRODU[ÇC][ÃA]O DO DIA/i)[1] || "");
    const atividades = []; let atual = null;
    prod.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l => {
      const q = l.match(/^\*?\s*(.+?)\s*=\s*([\d.,]+)\s*(m²|m³|m|un|t|h|kg)?$/i);
      const num = l.match(/^(\d+)\s+(.+)$/);
      if (q && atual) { atual.estaca = q[1].trim(); atual.qtd = parseFloat(q[2].replace(",",".")) || 0; atual.un = q[3] || (/\ba\s*\d/i.test(q[1]) ? "m" : "un"); }
      else if (num) { atual = {desc: num[2].replace(/estaca:?\s*$/i,"").trim(), lado:"", estaca:"", qtd:null, un:"vb"}; atividades.push(atual); }
    });
    const efSec = (body.split(/EFETIVO MOBILIZADO/i)[1] || "").split(/EQUIPAMENTOS/i)[0];
    const totalM = efSec.match(/TOTAL:\s*(\d+)/i);
    const ef = [];
    efSec.split(/\r?\n/).map(l=>l.replace(/^[\s*\-•]+/,"").trim()).forEach(l => {
      const mm = l.match(/^(\d+)\s+(.+?)\s*[–-]\s*(.+)$/);
      if (!mm) return;
      const nomes = mm[3].replace(/[;:]+$/,"").split(/\s+e\s+|,/).map(s=>s.trim()).filter(Boolean);
      ef.push({funcao: mm[2].trim(), qtd: Math.max(+mm[1], nomes.length)});
    });
    const eq = (body.split(/EQUIPAMENTOS[^\n]*/i)[1] || "").split(/\r?\n/).map(l=>l.replace(/^[\s\-*]+/,"").trim()).filter(Boolean).join("; ");
    rdos.push({data:`${y}-${m}-${d}`, obra, responsavel: enc, efetivo: ef, atividades,
      totalInf: totalM ? +totalM[1] : null, ocorrencias: eq ? "Equipamentos: " + eq : "", turno:"Diurno", clima:"Não informado", pluviometro:null});
  }
  return {rdos, avisos};
}

/* ---------- ações e eventos ---------- */
function csv(){
  const linhas = [["Data","Obra","Responsável","Status","Efetivo","Atividade","Lado","Estaca","Quantidade","Unidade","Ocorrências"]];
  filtrados().forEach(r => {
    if (!(r.atividades||[]).length) linhas.push([fmtData(r.data), r.obra, r.responsavel, STATUS[r.status]?.[0]||r.status, efTotal(r), "", "", "", "", "", r.ocorrencias]);
    (r.atividades||[]).forEach(a => linhas.push([fmtData(r.data), r.obra, r.responsavel, STATUS[r.status]?.[0]||r.status, efTotal(r), a.desc, a.lado, a.estaca, a.qtd ?? "", a.un, r.ocorrencias]));
  });
  const txt = linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\ufeff"+txt], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = `rdo-${(state.f.obra||"todas").replace(/\W+/g,"-").toLowerCase()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

  if (e.target.dataset.sel !== undefined) state.pend[+e.target.dataset.sel]._sel = e.target.checked;
});
document.addEventListener("input", e => { if (e.target.dataset.f==="q") { state.f.q = e.target.value; render(); } });
document.addEventListener("submit", e => {
  if (e.target.id==="frm") { e.preventDefault(); salvarForm(new FormData(e.target)); }
  else if (e.target.id==="cfgForm") { e.preventDefault(); const fd = new FormData(e.target); cfg.empresa = (fd.get("empresa")||"").trim() || "OBRA CONTROL"; cfg.slogan = (fd.get("slogan")||"").trim(); saveCfg(); toast("Configurações salvas."); render(); }
  else if (e.target.id==="reqForm") { e.preventDefault(); salvarReq(new FormData(e.target)); }
  else if (e.target.id==="almoxForm") { e.preventDefault(); salvarAlmox(new FormData(e.target)); }
  else if (e.target.id==="loginForm") { e.preventDefault(); handleLogin(e.target, new FormData(e.target)).catch(err => { $("#loginErr").textContent = "Erro ao entrar: " + err.message; }); }
  else if (e.target.id==="userForm") { e.preventDefault(); criarUsuario(new FormData(e.target)); }
  else if (e.target.id==="pastaForm") { e.preventDefault(); const fd = new FormData(e.target); const nome = (fd.get("nome")||"").trim(); if (!nome) return; PASTAS.push({id:uid(), nome, data: fd.get("data") || new Date().toISOString().slice(0,10), fotos:[]}); savePastas(); toast("Pasta criada."); render(); }
  else if (e.target.id==="ddsForm") { e.preventDefault(); const fd = new FormData(e.target); const pres = (fd.get("presentes")||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const [nome, funcao] = l.split("|").map(s=>(s||"").trim()); return {nome, funcao: funcao||""}; }); const reg = D(fd.get("data"), (fd.get("tema")||"").trim(), (fd.get("local")||"").trim() || "Não informado", (fd.get("interl")||"").trim(), +fd.get("min")||20, +fd.get("total")||0, +fd.get("veic")||0, {assuntos: (fd.get("assuntos")||"").split(";").map(s=>s.trim()).filter(Boolean), presentes: pres}); if (!reg.data || !reg.tema) { toast("Informe data e tema.", "err"); return; } DDS = DDS.filter(d=>!(d.data===reg.data && d.tema===reg.tema)); DDS.push({id:uid(), ...reg}); saveDds(); toast("DDS salvo."); go("seg"); }
  else if (e.target.id==="metaForm") { e.preventDefault(); const fd = new FormData(e.target); fd.forEach((v,k) => { if (k.startsWith("meta__")) { const o = k.slice(6), n = +v; if (n > 0) cfg.metas[o] = n; else delete cfg.metas[o]; } }); saveCfg(); toast("Metas salvas."); render(); }
});

/* ---------- inicialização ---------- */
(function(){
  const t = localStorage.getItem(KEY_TEMA);
  if (t==="claro") document.documentElement.dataset.theme = "light";
  if (t==="escuro") document.documentElement.dataset.theme = "dark";
})();
boot();
</script>
</body>
